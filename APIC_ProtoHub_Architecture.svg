<text x="50" y="932" class="t tiny mono">DEPLOY: DOCKER · ECS/EKS · AWS ap-south-1 (MUMBAI) — DATA RESIDENCY IN INDIA · CLOUDFRONT CDN · MSG91 SMS</text>
