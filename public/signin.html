<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign In & Onboarding — APIC ProtoHub</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/tokens.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30]">
  <!-- Shell Navigation injected by shell.js -->

  <main class="max-w-xl mx-auto px-6 py-12">
    <div class="proto-card bg-white shadow-lg border border-[#c4c5d7]">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-[#0037b0] text-white rounded-lg font-extrabold text-xl mb-3">AP</div>
        <h1 class="text-2xl font-extrabold text-[#0b1c30]">Sign In to APIC ProtoHub</h1>
        <p class="text-xs text-[#434655] mt-1">Access prototyping services, request quotations, and track active work orders</p>
      </div>

      <!-- Demo Persona Quick Selectors -->
      <div class="mb-6 p-3 bg-[#eff4ff] border border-blue-200 rounded">
        <div class="text-xs font-bold text-blue-900 uppercase tracking-wider mb-2 font-mono flex justify-between items-center">
          <span>● 1-Click Demo Evaluation Personas</span>
          <span class="text-[10px] text-blue-700">Database Seeded</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
          <button onclick="quickLogin('ravi')" class="proto-btn proto-btn-secondary text-left py-2 px-3 text-xs justify-start">
            <strong>Ravi Teja</strong> (Student Innovator)
          </button>
          <button onclick="quickLogin('sneha')" class="proto-btn proto-btn-secondary text-left py-2 px-3 text-xs justify-start">
            <strong>Sneha Reddy</strong> (Startup Innovator)
          </button>
          <button onclick="quickLogin('lakshmi')" class="proto-btn proto-btn-secondary text-left py-2 px-3 text-xs justify-start">
            <strong>M. Lakshmi</strong> (Staff — Vijayawada)
          </button>
          <button onclick="quickLogin('prasad')" class="proto-btn proto-btn-secondary text-left py-2 px-3 text-xs justify-start">
            <strong>K. Prasad</strong> (Manager — Vizag)
          </button>
        </div>
        <div class="mt-2 text-center">
          <button onclick="quickLogin('admin')" class="proto-btn proto-btn-primary text-xs py-1.5 px-4 w-full">
            Sign In as Statewide APIS Admin →
          </button>
        </div>
      </div>

      <!-- Simulated Phone OTP Form -->
      <div class="border-t border-[#c4c5d7] pt-4">
        <h2 class="text-xs font-bold uppercase text-[#434655] tracking-wider mb-2">Simulated Phone OTP Authentication</h2>
        
        <div id="otp-step-1" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-[#434655] mb-1">Mobile Number (India +91)</label>
            <input id="otp-phone" type="tel" value="+919000000001" class="w-full text-sm p-2.5 border border-[#c4c5d7] rounded font-mono"/>
          </div>
          <button onclick="requestOtp()" class="w-full proto-btn proto-btn-primary text-xs py-2.5">
            Request Verification OTP
          </button>
        </div>

        <div id="otp-step-2" class="hidden space-y-3 mt-3">
          <div class="p-3 bg-emerald-50 border border-emerald-200 rounded text-xs text-emerald-800">
            <strong>Simulated OTP Sent:</strong> <span id="display-otp-code" class="font-mono font-bold text-sm text-emerald-900 bg-white px-2 py-0.5 rounded border border-emerald-300 ml-1"></span>
            <div class="text-[11px] text-emerald-700 mt-1">Local demo mode — no external network SMS charged.</div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#434655] mb-1">Enter 6-Digit OTP</label>
            <input id="otp-input" type="text" maxlength="6" class="w-full text-center text-lg tracking-widest font-mono p-2 border border-[#c4c5d7] rounded"/>
          </div>
          <button onclick="verifyOtp()" class="w-full proto-btn proto-btn-primary text-xs py-2.5">
            Verify & Continue to Dashboard
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/shell.js"></script>
  <script>
    async function quickLogin(personaKey) {
      try {
        const res = await fetch('/api/auth/switch-persona', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personaKey }),
        });
        const data = await res.json();
        if (res.ok) {
          const role = data.user.role;
          if (role === 'apis_admin') window.location.href = '/admin';
          else if (role === 'centre_manager') window.location.href = '/manager';
          else if (role === 'centre_staff') window.location.href = '/staff';
          else window.location.href = '/customer';
        } else {
          alert('Error: ' + data.error.message);
        }
      } catch (e) {
        alert('Network error: ' + e.message);
      }
    }

    async function requestOtp() {
      const phone = document.getElementById('otp-phone').value;
      try {
        const res = await fetch('/api/auth/otp/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('otp-step-1').classList.add('hidden');
          document.getElementById('otp-step-2').classList.remove('hidden');
          document.getElementById('display-otp-code').textContent = data.demoOtpDisplay;
          document.getElementById('otp-input').value = data.demoOtpDisplay;
        } else {
          alert(data.error.message);
        }
      } catch (e) {
        alert('Error requesting OTP: ' + e.message);
      }
    }

    async function verifyOtp() {
      const phone = document.getElementById('otp-phone').value;
      const code = document.getElementById('otp-input').value;
      try {
        const res = await fetch('/api/auth/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, code }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/customer';
        } else {
          alert(data.error.message);
        }
      } catch (e) {
        alert('Verification error: ' + e.message);
      }
    }
  </script>
</body>
</html>
