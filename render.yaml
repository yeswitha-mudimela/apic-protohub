services:
  - type: web
    name: apic-protohub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
